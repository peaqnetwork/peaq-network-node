name: Pull Request Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    container:
      image: rust:1.87-slim
    
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      
      - name: "[Check] cargo fmt"
        run: cargo fmt --check

  test-and-clippy:
    runs-on: ubuntu-latest
    container:
      image: paritytech/ci-linux:production
    
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      
      - name: Cache build outputs
        uses: actions/cache@v3
        with:
          path: |
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run tests and clippy in parallel
        run: |
          # Start tests and clippy in parallel
          cargo test --release --features on-chain-release-build &
          TEST_PID=$!
          
          cargo clippy --release --features on-chain-release-build -- -Dwarnings &
          CLIPPY_PID=$!
          
          # Wait for both processes to complete
          wait $TEST_PID
          TEST_EXIT=$?
          
          wait $CLIPPY_PID
          CLIPPY_EXIT=$?
          
          # Exit with failure if either process failed
          if [ $TEST_EXIT -ne 0 ] || [ $CLIPPY_EXIT -ne 0 ]; then
            exit 1
          fi