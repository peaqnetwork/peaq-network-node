[package]
name = "peaq-pallet-did2"
version = "0.1.0"
authors = ["Peaq Network <info@peaq.network>"]
edition = "2021"
description = "FRAME pallet for DID v2 – decentralized identity management"

[dependencies]
parity-scale-codec = { workspace = true, default-features = false, features = ["derive"] }
frame-benchmarking = { workspace = true, default-features = false, optional = true }
frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
prost = { workspace = true, default-features = true, features = ["derive"], optional = true }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-runtime = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
serde = { version = "1.0", default-features = true, features = ["derive"], optional = true }

[dev-dependencies]
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }

[features]
default = ["std"]
std = [
	"parity-scale-codec/std",
	"frame-benchmarking/std",
	"frame-support/std",
	"frame-system/std",
	"prost",
	"scale-info/std",
	"sp-runtime/std",
	"sp-std/std",
	"serde",
]
runtime-benchmarks = [
	"frame-benchmarking",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = ["frame-support/try-runtime", "frame-system/try-runtime"]
