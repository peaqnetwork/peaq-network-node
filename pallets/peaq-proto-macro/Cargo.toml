[package]
name = "peaq-proto-macro"
version = "0.1.0"
authors = ["Peaq Network <info@peaq.network>"]
edition = "2021"
description = "Procedural macro: derive ToProto and generate_proto_file! for DID spec structs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
